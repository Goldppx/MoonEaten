<script type="module">const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const intro=document.querySelector('.intro');
const wordmark=document.querySelector('.intro-wordmark');
const finish=()=>intro.classList.add('finished');
wordmark.addEventListener('animationend',finish,{once:true});
if(reduced.matches)finish();
setTimeout(finish,3400);

// Individual objects reveal along alternating diagonal trajectories.
const observer=new IntersectionObserver(entries=>{
  for(const entry of entries)if(entry.isIntersecting){entry.target.classList.remove('art-enter');observer.unobserve(entry.target)}
},{threshold:.08});
function reveal(root){
  root.querySelectorAll('.card,.map-panel,.collection-rule').forEach(el=>{
    if(el.dataset.motion)return;el.dataset.motion='ready';
    if(reduced.matches)return;
    el.classList.add('art-seen','art-enter');observer.observe(el);
  });
}
reveal(document);
new MutationObserver(()=>reveal(document)).observe(document.querySelector('#cards'),{childList:true});

// Scroll moves the orbital composition on a diagonal; normal document scroll remains intact.
let scheduled=false,heroVisible=true;
new IntersectionObserver(([entry])=>{heroVisible=entry.isIntersecting}).observe(intro);
function track(){
  scheduled=false;if(reduced.matches||!heroVisible)return;
  const progress=Math.min(1,Math.max(0,-intro.getBoundingClientRect().top/intro.offsetHeight));
  document.querySelector('.celestial').style.transform=`translate(${progress*75}px,${progress*-40}px) rotate(${progress*17}deg)`;
}
addEventListener('scroll',()=>{if(!scheduled){scheduled=true;requestAnimationFrame(track)}},{passive:true});

// Keep native dialog focus handling and add a real exit animation before close().
const closing=new WeakSet();
function closeWithMotion(dialog){
  if(closing.has(dialog))return;
  if(reduced.matches){dialog.close();return}
  closing.add(dialog);dialog.classList.add('closing');
  setTimeout(()=>{dialog.close();dialog.classList.remove('closing');closing.delete(dialog)},230);
}
document.addEventListener('click',event=>{
  const close=event.target.closest('.close');
  const dialog=close?.closest('dialog')||(event.target instanceof HTMLDialogElement?event.target:null);
  if(!dialog||!dialog.open)return;
  if(!close){const rect=dialog.getBoundingClientRect();if(event.clientX>=rect.left&&event.clientX<=rect.right&&event.clientY>=rect.top&&event.clientY<=rect.bottom){event.stopImmediatePropagation();return}}
  event.preventDefault();event.stopImmediatePropagation();closeWithMotion(dialog);
},true);
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('cancel',event=>{event.preventDefault();closeWithMotion(dialog)}));
// Random pick gets a brief orbital flourish, while the result stays immediately actionable.
document.querySelector('#random').addEventListener('click',event=>{
  if(reduced.matches)return;
  event.currentTarget.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(135deg) scale(.78)',offset:.45},{transform:'rotate(360deg) scale(1)'}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'});
});
document.addEventListener('visibilitychange',()=>{document.querySelectorAll('.orbit').forEach(el=>el.style.animationPlayState=document.hidden?'paused':'running')});
